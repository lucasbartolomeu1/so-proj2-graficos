<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gráficos da Medição — Desempenho e Recursos com Processos Acumulados no CS</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #0f172a;
      --ink-muted: #475569;
      --border: #cbd5e1;
      --border-soft: #e2e8f0;
      --blue: #1d4ed8;
      --blue-soft: #dbeafe;
      --orange: #c2410c;
      --orange-soft: #ffedd5;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px 48px;
    }

    /* Top control bar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink-muted);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover {
      border-color: var(--blue);
      color: var(--ink);
    }

    .tab-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-btn {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .action-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    /* Chart Card */
    .chart-card {
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 28px 32px 24px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      margin-bottom: 24px;
      position: relative;
    }

    .chart-kicker {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      margin: 0 0 8px;
    }

    .chart-title {
      font-size: clamp(22px, 2.5vw, 31px);
      font-weight: 800;
      color: var(--ink);
      margin: 0 0 8px;
      line-height: 1.2;
      letter-spacing: -0.015em;
    }

    .chart-subtitle {
      font-size: 16px;
      color: var(--ink-muted);
      margin: 0 0 20px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 24px;
      margin-bottom: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .legend-swatch {
      width: 20px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
      flex-shrink: 0;
    }

    .svg-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .svg-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 720px;
    }

    .chart-footer-hint {
      margin-top: 8px;
      font-size: 14px;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 100;
      max-width: 320px;
    }

    .tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .tooltip-title {
      font-weight: 800;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-variant-numeric: tabular-nums;
    }

    /* Data Verification Table */
    .table-card {
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .table-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .table-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
    }

    .table-meta {
      font-size: 14px;
      color: var(--ink-muted);
      margin: 0;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      text-align: right;
      padding: 12px 14px;
      border-bottom: 2px solid var(--ink);
      font-weight: 800;
      color: var(--ink);
      background: #f8fafc;
      vertical-align: bottom;
    }

    thead th:first-child {
      text-align: left;
    }

    thead th .th-unit {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-soft);
      text-align: right;
      font-weight: 600;
      color: var(--ink);
    }

    tbody td:first-child {
      text-align: left;
      font-weight: 700;
    }

    tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    tbody tr.highlight-col-row:hover {
      background: #eff6ff;
    }

    .col-active {
      background: #eff6ff !important;
      color: var(--blue) !important;
    }

    .col-active-orange {
      background: #fff7ed !important;
      color: var(--orange) !important;
    }

    .notes {
      margin-top: 14px;
      padding: 12px 16px;
      background: #f8fafc;
      border-left: 4px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--ink-muted);
    }

    .notes p {
      margin: 4px 0;
    }

    /* Presentation Mode */
    body.presentation-mode {
      background: #ffffff;
    }

    body.presentation-mode .page {
      max-width: 1380px;
      padding: 14px 28px 24px;
    }

    body.presentation-mode .chart-card {
      border: none;
      box-shadow: none;
      padding: 12px 8px;
      margin-bottom: 16px;
    }

    body.presentation-mode .chart-title {
      font-size: clamp(26px, 3.1vw, 36px);
    }

    /* Bar hover polish */
    .bar-rect {
      transition: opacity 0.12s ease;
      cursor: pointer;
    }

    .bar-group:hover .bar-rect {
      opacity: 0.88;
    }

    @media print {
      body {
        background: #ffffff;
      }
      .toolbar,
      .chart-footer-hint,
      .tooltip {
        display: none !important;
      }
      .page {
        max-width: 100%;
        padding: 0;
      }
      .chart-card,
      .table-card {
        border: 1px solid #cbd5e1;
        box-shadow: none;
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="toolbar" aria-label="Seleção de gráficos">
      <div class="tabs" id="tabs"></div>
      <div class="actions">

  <script>
    // =========================================================================
    // 1. DADOS EXATOS FORNECIDOS PELO GRUPO (CSV original sem alterações)
    // =========================================================================
    const RAW_CSV = `condicao;FPS Médio (Quadros por segundo);1% Low FPS (Equivalente à cauda p99 de tempo de quadro). (Quadros por segundo (FPS).);CPU (%) (porcentagem da CPU);RAM (%) (GB da RAM)
CS;194,5;128,8;26,6;63,1
+Discord;190,3;115,6;25,4;66,5
+Opera com vídeo;182,5;116,3;27,9;74,4
+Minecraft (servidor);190,7;124,4;34,2;80,0
+Roblox (mapas);167,6;90,4;50,3;87,1
+LoL (treino);182,8;81,2;64,8;90,5
+Chrome;156,4;52,2;71.4;95.9`;

    // =========================================================================
    // 2. PARSER FIEL (suporta vírgula ou ponto decimal e múltiplas rodadas)
    // =========================================================================
    function parseCell(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return { raw: trimmed, values: [], mean: null, hasDotDecimal: false, invalid: true };

      // Suporta múltiplos valores na mesma célula (ex: separados por espaço, "/" ou "|")
      const tokens = trimmed.split(/[\s/|]+/).filter(Boolean);
      const values = [];
      let hasDotDecimal = false;
      let invalid = false;

      for (const token of tokens) {
        if (/^-?\d+\.\d+$/.test(token)) hasDotDecimal = true;
        const normalized = token.replace(",", ".");
        if (/^-?\d+(\.\d+)?$/.test(normalized)) {
          values.push(Number(normalized));
        } else {
          invalid = true;
        }
      }

      const mean = values.length > 0
        ? values.reduce((acc, v) => acc + v, 0) / values.length
        : null;

      return { raw: trimmed, values, mean, hasDotDecimal, invalid };
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      const headers = lines[0].split(";").map(h => h.trim());
      const rows = [];
      const dotDecimalCells = [];
      const invalidCells = [];
      let maxRounds = 1;

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(";");
        const condition = cols[0].trim();
        const metrics = [];

        for (let c = 1; c < headers.length; c++) {
          const parsed = parseCell(cols[c] ?? "");
          metrics.push(parsed);
          if (parsed.values.length > maxRounds) maxRounds = parsed.values.length;
          if (parsed.hasDotDecimal) {
            dotDecimalCells.push({ condition, header: headers[c], raw: parsed.raw });
          }
          if (parsed.invalid) {
            invalidCells.push({ condition, header: headers[c], raw: parsed.raw });
          }
        }

        rows.push({ condition, metrics });
      }

      return { headers, rows, dotDecimalCells, invalidCells, maxRounds };
    }

    const DATASET = parseCSV(RAW_CSV);

    // =========================================================================
    // 3. DEFINIÇÃO DOS GRÁFICOS DO GRUPO (mensagens, eixos e cores)

    const COLORS = {

    const METRIC_META = [

      { colIndex: 1, shortName: "1% Low FPS", unit: "FPS", fullUnit: "Quadros por segundo (FPS)", member: "Lucas Bartolomeu", color: COLORS.orange },
      { colIndex: 2, shortName: "CPU (%)", unit: "%", fullUnit: "Uso de CPU (%)", member: "Kauê Cordeiro", color: COLORS.blue },
      { colIndex: 3, shortName: "RAM (%)", unit: "%", fullUnit: "Uso de RAM (%)", member: "Arthur Candido", color: COLORS.orange }
    ];

    const VIEWS = [
      {

        tabLabel: "1. FPS Médio vs. 1% Low",
        charts: [
          {
            kicker: "Desempenho no CS2 • Comparação principal",

            ]
          }
        ]
      },
      {
        id: "recursos",
        tabLabel: "2. CPU (%) e RAM (%)",
        charts: [
          {
            kicker: "Recursos do sistema • Processador e memória",
            title: "Acumular 6 programas com o CS leva a RAM de 63,1% a 95,9% e eleva a CPU de 26,6% para 71,4%",
            subtitle: "O uso de RAM cresce em todas as etapas até quase atingir o limite (100%), enquanto a CPU acelera fortemente a partir de +Roblox (mapas).",
            xLabel: "Condição experimental (processos acumulados com CS)",
            yLabel: "Uso do recurso (%)",
            unitSuffix: "%",
            yMax: 108,
            yTicks: [0, 20, 40, 60, 80, 100],
            limitLine: { value: 100, label: "100% (limite)" },
            series: [
              { colIndex: 2, label: "CPU (%)", color: COLORS.blue },
              { colIndex: 3, label: "RAM (%)", color: COLORS.orange }
            ]
          }
        ]
      },
      {
        id: "fps-medio",
        tabLabel: "FPS Médio",
        charts: [
          {
            kicker: "Métrica individual • Joaquim Lange",
            title: "O FPS médio cai de 194,5 para 156,4 FPS ao acumular 6 programas abertos com o CS",
            subtitle: "Queda moderada na taxa média de quadros, com oscilações em +Minecraft (190,7 FPS) e +LoL (182,8 FPS).",
            xLabel: "Condição experimental (processos acumulados com CS)",
            yLabel: "FPS Médio (Quadros por segundo)",
            unitSuffix: "",
            yMax: 220,
            yTicks: [0, 50, 100, 150, 200],
            limitLine: null,
            series: [
              { colIndex: 0, label: "FPS Médio (FPS)", color: COLORS.blue }
            ]
          }
        ]
      },
      {

        tabLabel: "1% Low FPS",
        charts: [

            subtitle: "A cauda p99 evidencia os travamentos (stutterings) com mais clareza que a média, exceto pelo ponto em +Minecraft (124,4 FPS).",

            yTicks: [0, 25, 50, 75, 100, 125, 150],
            limitLine: null,
            series: [
              { colIndex: 1, label: "1% Low FPS (FPS)", color: COLORS.orange }

      {
        id: "cpu",

        charts: [
          {
            kicker: "Métrica individual • Kauê Cordeiro",
            title: "O uso de CPU sobe de 26,6% para 71,4% com o acúmulo de processos junto ao CS",
            subtitle: "Permanece abaixo de 35% até +Minecraft (servidor) e salta para 50,3%, 64,8% e 71,4% com os jogos e navegador adicionais.",
            xLabel: "Condição experimental (processos acumulados com CS)",
            yLabel: "Uso de CPU (%)",
            unitSuffix: "%",
            yMax: 108,
            yTicks: [0, 20, 40, 60, 80, 100],
            limitLine: { value: 100, label: "100% (limite)" },
            series: [
              { colIndex: 2, label: "CPU (%)", color: COLORS.blue }
            ]
          }
        ]
      },
      {
        id: "ram",
        tabLabel: "RAM (%)",
        charts: [
          {
            kicker: "Métrica individual • Arthur Candido",
            title: "O uso de RAM cresce continuamente de 63,1% até 95,9% ao empilhar 6 programas com o CS",
            subtitle: "Aumento monotônico em todas as condições medidas, aproximando-se da saturação total da memória.",
            xLabel: "Condição experimental (processos acumulados com CS)",
            yLabel: "Uso de RAM (%)",
            unitSuffix: "%",
            yMax: 108,
            yTicks: [0, 20, 40, 60, 80, 100],
            limitLine: { value: 100, label: "100% (limite)" },
            series: [

            ]
          }
        ]
      },
      {
        id: "todos",
        tabLabel: "Todos (Relatório)",
        charts: [] // preenchido abaixo com os 2 gráficos principais
      }
    ];

    VIEWS[6].charts = [VIEWS[0].charts[0], VIEWS[1].charts[0]];

    // =========================================================================
    // 4. FORMATAÇÃO E QUEBRA DE RÓTULOS DO EIXO X
    // =========================================================================
    function fmtBR(num, suffix = "") {
      return num.toFixed(1).replace(".", ",") + suffix;
    }

    function splitConditionLabel(label) {
      const map = {
        "CS": ["CS"],
        "+Discord": ["+Discord"],
        "+Opera com vídeo": ["+Opera", "com vídeo"],
        "+Minecraft (servidor)": ["+Minecraft", "(servidor)"],
        "+Roblox (mapas)": ["+Roblox", "(mapas)"],
        "+LoL (treino)": ["+LoL", "(treino)"],
        "+Chrome": ["+Chrome"]
      };
      if (map[label]) return map[label];
      if (label.length <= 14) return [label];
      const parts = label.split(" ");
      const mid = Math.ceil(parts.length / 2);
      return [parts.slice(0, mid).join(" "), parts.slice(mid).join(" ")];
    }

    // =========================================================================
    // 5. RENDERIZAÇÃO DO GRÁFICO SVG (vetorial, legível de longe, eixo em 0)
    // =========================================================================
    const SVG_NS = "http://www.w3.org/2000/svg";

    function svgEl(tag, attrs = {}, textContent = null) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, String(v));
      }
      if (textContent !== null) el.textContent = textContent;
      return el;
    }

    function buildChartSVG(config) {
      const W = 1120;
      const H = 490;
      const margin = { top: 34, right: 34, bottom: 108, left: 96 };
      const plotW = W - margin.left - margin.right;
      const plotH = H - margin.top - margin.bottom;

      const svg = svgEl("svg", {
        viewBox: `0 0 ${W} ${H}`,
        role: "img",
        "aria-label": config.title
      });

      // Fundo branco explícito (importante para exportar PNG nítido)
      svg.appendChild(svgEl("rect", { x: 0, y: 0, width: W, height: H, fill: "#ffffff" }));

      const yScale = (val) => margin.top + plotH - (val / config.yMax) * plotH;

      // Linhas de grade horizontais + ticks do eixo Y (sempre começando em 0)
      for (const tick of config.yTicks) {
        const y = yScale(tick);
        svg.appendChild(svgEl("line", {
          x1: margin.left,
          x2: W - margin.right,
          y1: y,
          y2: y,
          stroke: tick === 0 ? COLORS.axis : COLORS.grid,
          "stroke-width": tick === 0 ? 2 : 1.25
        }));

        svg.appendChild(svgEl("text", {
          x: margin.left - 14,
          y: y + 5,
          "text-anchor": "end",
          fill: COLORS.muted,
          "font-size": 15,
          "font-weight": 700,
          "font-family": "Segoe UI, system-ui, Arial, sans-serif"
        }, `${tick}${config.unitSuffix}`));
      }

      // Linha de limite opcional (100%)
      if (config.limitLine) {
        const ly = yScale(config.limitLine.value);
        svg.appendChild(svgEl("line", {
          x1: margin.left,
          x2: W - margin.right,
          y1: ly,
          y2: ly,
          stroke: COLORS.limit,
          "stroke-width": 1.75,
          "stroke-dasharray": "7 6"
        }));
        svg.appendChild(svgEl("text", {
          x: W - margin.right,
          y: ly - 8,
          "text-anchor": "end",
          fill: COLORS.muted,
          "font-size": 13,
          "font-weight": 700,
          "font-family": "Segoe UI, system-ui, Arial, sans-serif"
        }, config.limitLine.label));
      }

      // Eixo Y vertical
      svg.appendChild(svgEl("line", {
        x1: margin.left,
        x2: margin.left,
        y1: margin.top,
        y2: margin.top + plotH,
        stroke: COLORS.axis,
        "stroke-width": 2
      }));

      // Título do eixo Y (nome + unidade)
      svg.appendChild(svgEl("text", {
        x: 28,
        y: margin.top + plotH / 2,
        "text-anchor": "middle",
        fill: COLORS.ink,
        "font-size": 17,
        "font-weight": 800,
        "font-family": "Segoe UI, system-ui, Arial, sans-serif",
        transform: `rotate(-90 28 ${margin.top + plotH / 2})`
      }, config.yLabel));

      // Título do eixo X
      svg.appendChild(svgEl("text", {
        x: margin.left + plotW / 2,
        y: H - 14,
        "text-anchor": "middle",
        fill: COLORS.ink,
        "font-size": 17,
        "font-weight": 800,
        "font-family": "Segoe UI, system-ui, Arial, sans-serif"
      }, config.xLabel));

      // Barras por condição
      const nCats = DATASET.rows.length;
      const nSeries = config.series.length;
      const catStep = plotW / nCats;
      const groupPadding = nSeries === 1 ? catStep * 0.24 : catStep * 0.14;
      const innerGap = nSeries > 1 ? 8 : 0;
      const availW = catStep - groupPadding * 2;
      const barW = Math.min(nSeries === 1 ? 74 : 52, (availW - innerGap * (nSeries - 1)) / nSeries);
      const totalBarsW = barW * nSeries + innerGap * (nSeries - 1);
      const zeroY = yScale(0);

      DATASET.rows.forEach((row, idx) => {
        const catCenterX = margin.left + catStep * idx + catStep / 2;
        const startX = catCenterX - totalBarsW / 2;

        // Rótulo da condição no eixo X (1 ou 2 linhas)
        const lines = splitConditionLabel(row.condition);
        const textEl = svgEl("text", {
          x: catCenterX,
          y: zeroY + 26,
          "text-anchor": "middle",
          fill: COLORS.ink,
          "font-size": 15,
          "font-weight": 700,
          "font-family": "Segoe UI, system-ui, Arial, sans-serif"
        });
        lines.forEach((ln, li) => {
          textEl.appendChild(svgEl("tspan", {
            x: catCenterX,
            dy: li === 0 ? 0 : 19
          }, ln));
        });
        svg.appendChild(textEl);

        // Barras de cada série
        config.series.forEach((serie, sIdx) => {
          const cell = row.metrics[serie.colIndex];
          if (cell.mean === null) return; // Sem valor numérico: ponto fica de fora

          const bx = startX + sIdx * (barW + innerGap);
          const by = yScale(cell.mean);
          const bh = Math.max(0, zeroY - by);

          const g = svgEl("g", { class: "bar-group" });

          const rect = svgEl("rect", {
            class: "bar-rect",
            x: bx,
            y: by,
            width: barW,
            height: bh,
            rx: 5,
            ry: 5,
            fill: serie.color
          });
          g.appendChild(rect);

          // Se houver repetições na célula (>1 rodada), mostra cada rodada sobre a barra
          if (cell.values.length > 1) {
            cell.values.forEach((val, rIdx) => {
              const jitter = cell.values.length === 1
                ? 0
                : ((rIdx / (cell.values.length - 1)) - 0.5) * (barW * 0.45);
              g.appendChild(svgEl("circle", {
                cx: bx + barW / 2 + jitter,
                cy: yScale(val),
                r: 4.5,
                fill: "#ffffff",
                stroke: COLORS.ink,
                "stroke-width": 2
              }));
            });
          }

          // Valor direto acima da barra (legível de longe)
          const labelY = Math.max(margin.top + 14, by - 9);
          g.appendChild(svgEl("text", {
            x: bx + barW / 2,
            y: labelY,
            "text-anchor": "middle",
            fill: serie.color,
            "font-size": nSeries === 1 ? 17 : 15,
            "font-weight": 800,
            "font-family": "Segoe UI, system-ui, Arial, sans-serif"
          }, fmtBR(cell.mean, config.unitSuffix)));

          // Tooltip interativo ao passar o mouse
          const baseCell = DATASET.rows[0].metrics[serie.colIndex];
          g.addEventListener("mousemove", (ev) => {
            showTooltip(ev, row.condition, serie, cell, baseCell, config.unitSuffix);
          });
          g.addEventListener("mouseleave", hideTooltip);

          svg.appendChild(g);
        });
      });

      return svg;
    }

    // =========================================================================
    // 6. TOOLTIP INTERATIVO
    // =========================================================================
    const tooltipEl = document.getElementById("tooltip");

    function showTooltip(ev, condition, serie, cell, baseCell, suffix) {
      const diff = baseCell.mean !== null ? cell.mean - baseCell.mean : null;
      const diffStr = diff === null || condition === DATASET.rows[0].condition
        ? "Condição base"
        : `${diff >= 0 ? "+" : ""}${fmtBR(diff, suffix)} vs. CS`;

      const roundsHtml = cell.values.length > 1
        ? `<div class="tooltip-row"><span>Rodadas:</span><strong>${cell.values.map(v => fmtBR(v, suffix)).join(" | ")}</strong></div>`
        : "";

      tooltipEl.innerHTML = `
        <div class="tooltip-title">${condition}</div>
        <div class="tooltip-row"><span>${serie.label}:</span><strong>${fmtBR(cell.mean, suffix)}</strong></div>
        ${roundsHtml}
        <div class="tooltip-row"><span>Diferença:</span><span>${diffStr}</span></div>
      `;

      const pad = 16;
      let left = ev.clientX + pad;
      let top = ev.clientY - 12;
      if (left + 280 > window.innerWidth) left = ev.clientX - 280;
      if (top < 12) top = 12;

      tooltipEl.style.left = `${left}px`;
      tooltipEl.style.top = `${top}px`;
      tooltipEl.classList.add("visible");
    }

    function hideTooltip() {
      tooltipEl.classList.remove("visible");
    }

    // =========================================================================
    // 7. RENDERIZAÇÃO DA PÁGINA, ABAS E TABELA DE CONFERÊNCIA
    // =========================================================================
    let currentViewIndex = 0;

    function renderTabs() {
      const tabsEl = document.getElementById("tabs");
      tabsEl.innerHTML = "";
      VIEWS.forEach((view, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (i === currentViewIndex ? " active" : "");
        btn.textContent = view.tabLabel;
        btn.addEventListener("click", () => {
          currentViewIndex = i;
          render();
        });
        tabsEl.appendChild(btn);
      });
    }

    function renderCharts() {
      const container = document.getElementById("charts-container");
      container.innerHTML = "";
      const view = VIEWS[currentViewIndex];

      view.charts.forEach((cfg) => {
        const card = document.createElement("article");
        card.className = "chart-card";

        const kicker = document.createElement("p");
        kicker.className = "chart-kicker";
        kicker.textContent = cfg.kicker;

        const h1 = document.createElement("h1");
        h1.className = "chart-title";
        h1.textContent = cfg.title;

        const sub = document.createElement("p");
        sub.className = "chart-subtitle";
        sub.textContent = cfg.subtitle;

        const legend = document.createElement("div");
        legend.className = "legend";
        cfg.series.forEach((s) => {
          const item = document.createElement("div");
          item.className = "legend-item";
          item.innerHTML = `<span class="legend-swatch" style="background:${s.color}"></span><span>${s.label}</span>`;
          legend.appendChild(item);
        });

        const wrap = document.createElement("div");
        wrap.className = "svg-wrap";
        wrap.appendChild(buildChartSVG(cfg));

        const footer = document.createElement("div");
        footer.className = "chart-footer-hint";
        footer.innerHTML = `
          <span>Eixo vertical iniciando em 0 • Valores exatos da medição (1 rodada por condição)</span>
          <span>Dica: use ← e → para trocar de gráfico na apresentação</span>
        `;

        card.append(kicker, h1, sub, legend, wrap, footer);
        container.appendChild(card);
      });
    }

    function renderTable() {
      const view = VIEWS[currentViewIndex];
      const activeCols = new Map();
      view.charts.forEach((cfg) => {
        cfg.series.forEach((s) => activeCols.set(s.colIndex, s.color));
      });

      const tableEl = document.getElementById("data-table");
      const metaEl = document.getElementById("table-meta");
      metaEl.textContent = `${DATASET.rows.length} condições medidas • ${DATASET.maxRounds === 1 ? "1 medição por condição (sem repetições)" : `até ${DATASET.maxRounds} rodadas por condição`}`;

      const headCols = [
        { title: "Condição", unit: "CSV original" },
        { title: "FPS Médio", unit: "Quadros por segundo" },
        { title: "1% Low FPS", unit: "Quadros por segundo (FPS) • cauda p99" },
        { title: "CPU (%)", unit: "porcentagem da CPU" },
        { title: "RAM (%)", unit: "porcentagem da RAM*" }
      ];

      let theadHtml = "<thead><tr>";
      headCols.forEach((hc, i) => {
        const colIdx = i - 1;
        let cls = "";
        if (activeCols.has(colIdx)) {
          cls = activeCols.get(colIdx) === COLORS.orange ? "col-active-orange" : "col-active";
        }
        theadHtml += `<th class="${cls}">${hc.title}<span class="th-unit">${hc.unit}</span></th>`;
      });
      theadHtml += "</tr></thead>";

      let tbodyHtml = "<tbody>";
      DATASET.rows.forEach((row) => {
        tbodyHtml += `<tr class="highlight-col-row"><td>${row.condition}</td>`;
        row.metrics.forEach((cell, cIdx) => {
          let cls = "";
          if (activeCols.has(cIdx)) {
            cls = activeCols.get(cIdx) === COLORS.orange ? "col-active-orange" : "col-active";
          }
          const displayVal = cell.mean === null ? "— (não numérico)" : fmtBR(cell.mean);
          tbodyHtml += `<td class="${cls}" title="Valor bruto no CSV: ${cell.raw}">${displayVal}</td>`;
        });
        tbodyHtml += "</tr>";
      });
      tbodyHtml += "</tbody>";

      tableEl.innerHTML = theadHtml + tbodyHtml;

      // Notas de auditoria dos dados
      const notesEl = document.getElementById("data-notes");
      const notes = [];
      notes.push("<strong>Origem dos dados:</strong> todos os valores acima reproduzem fielmente o CSV fornecido pelo grupo (benchmark CS2 + HWiNFO), sem estimativas ou valores inventados.");

      if (DATASET.dotDecimalCells.length > 0) {
        const list = DATASET.dotDecimalCells
          .map(d => `<code>${d.condition}</code> (${d.raw})`)
          .join(" e ");
        notes.push(`<strong>Formatação decimal observada:</strong> as células ${list} vieram com ponto decimal em vez de vírgula no CSV original; foram lidas corretamente como números decimais (${DATASET.dotDecimalCells.map(d => d.raw.replace(".", ",")).join(" e ")}).`);
      }

      notes.push("<strong>*Unidade de RAM:</strong> o cabeçalho original do CSV traz <code>RAM (%) (GB da RAM)</code>; os números registrados (63,1 a 95,9) correspondem à porcentagem (<code>%</code>) de uso da RAM, unidade adotada no eixo vertical.");

      if (DATASET.invalidCells.length > 0) {
        const list = DATASET.invalidCells.map(d => `${d.condition} / ${d.header}: "${d.raw}"`).join("; ");
        notes.push(`<strong>Células não numéricas omitidas dos gráficos:</strong> ${list}.`);
      }

      notesEl.innerHTML = notes.map(n => `<p>${n}</p>`).join("");
    }

    function render() {
      renderTabs();
      renderCharts();
      renderTable();
    }

    // =========================================================================
    // 8. AÇÕES: MODO PROJEÇÃO, EXPORTAR PNG E IMPRIMIR
    // =========================================================================
    document.getElementById("btn-presentation").addEventListener("click", () => {
      document.body.classList.toggle("presentation-mode");
      const active = document.body.classList.contains("presentation-mode");
      document.getElementById("btn-presentation").textContent = active ? "Sair da Projeção" : "Modo Projeção";
    });

    document.getElementById("btn-print").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const card = document.querySelector(".chart-card");
      const svg = card ? card.querySelector("svg") : null;
      if (!svg) return;

      const title = card.querySelector(".chart-title")?.textContent || "";
      const legendItems = Array.from(card.querySelectorAll(".legend-item")).map(el => ({
        color: el.querySelector(".legend-swatch").style.background,
        label: el.textContent.trim()
      }));

      // Monta um PNG de alta resolução com título + legenda + SVG
      const scale = 2;
      const w = 1200;
      const headerH = 124;
      const svgH = Math.round((490 / 1120) * (w - 48));
      const h = headerH + svgH + 24;

      const canvas = document.createElement("canvas");
      canvas.width = w * scale;
      canvas.height = h * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);

      // Título com quebra de linha
      ctx.fillStyle = "#0f172a";
      ctx.font = "800 24px 'Segoe UI', system-ui, Arial, sans-serif";
      const words = title.split(" ");
      let line = "";
      let y = 38;
      for (const word of words) {
        const test = line ? line + " " + word : word;
        if (ctx.measureText(test).width > w - 64) {
          ctx.fillText(line, 32, y);
          line = word;
          y += 30;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, 32, y);

      // Legenda
      let lx = 32;
      const ly = y + 32;
      ctx.font = "700 16px 'Segoe UI', system-ui, Arial, sans-serif";
      for (const item of legendItems) {
        ctx.fillStyle = item.color;
        ctx.fillRect(lx, ly - 12, 18, 13);
        ctx.fillStyle = "#0f172a";
        ctx.fillText(item.label, lx + 26, ly);
        lx += 26 + ctx.measureText(item.label).width + 28;
      }

      // Serializa o SVG
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svg);
      const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 24, headerH, w - 48, svgH);
        URL.revokeObjectURL(url);
        const a = document.createElement("a");
        a.download = `grafico_${VIEWS[currentViewIndex].id}.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      };
      img.src = url;
    });

    // Atalhos de teclado para apresentação em sala
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") {
        currentViewIndex = (currentViewIndex + 1) % VIEWS.length;
        render();
      } else if (ev.key === "ArrowLeft") {
        currentViewIndex = (currentViewIndex - 1 + VIEWS.length) % VIEWS.length;
        render();
      } else if (ev.key.toLowerCase() === "f" && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
        document.getElementById("btn-presentation").click();
      }
    });

    render();
  </script>
</body>
